[project]
name = "river-gauge-shipping-utac"
version = "1.0.0"
description = "Rhine / Western-Europe low-water inland shipping impacts (Bedoya-Maya 2024, Vinke 2022, Kaub 78 cm, IfW Kiel 2018) -- no UTAC/CREP/AFET bridge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Römer, Johann" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/GenesisAeon/river-gauge-shipping-utac"
Repository = "https://github.com/GenesisAeon/river-gauge-shipping-utac"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/river_gauge_shipping_utac"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=river_gauge_shipping_utac --cov-report=term-missing -v"
